<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee 721 company maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="styles.css"></head><body><header><div><h1>Company visit maps</h1><p>721 active companies and Inactive companies · Delivery address preferred · Slanice 20, Split uses headquarters</p></div><nav id="tabs"></nav></header><main><aside><div class="tools"><div id="counts" class="counts"></div><div class="legend"><span class="dot" style="background:#147b97"></span>Active &nbsp; <span class="dot" style="background:#cf3434"></span>Inactive &nbsp; <span class="dot" style="background:#d58a12"></span>Active approximate. Dashed outlines: approximate locations.</div><input id="search" aria-label="Search companies" placeholder="Search company, town or address"><select id="status" aria-label="Location status"><option value="all">All companies</option><option value="matched">House / street matches</option><option value="review">Approximate / review</option><option value="missing">Not located</option></select><div class="actions"><button id="locate">Follow location</button><button id="pause" disabled>Pause</button></div><div id="location-status" role="status" style="font-size:12px;margin-top:8px">Location following · 4 km radius</div><div class="actions"><button id="fit">Show all</button><button id="csv">Download addresses</button></div></div><div id="list" class="list"></div></aside><div id="map"></div></main><script src="app.js"></script></body></html>
